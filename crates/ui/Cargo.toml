[package]
name = "autopilot-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
autopilot-accounts = { path = "../accounts" }
autopilot-agent = { path = "../agent" }
autopilot-agent-claude = { path = "../agent-claude" }
autopilot-agent-fixture = { path = "../agent-fixture" }
autopilot-core.workspace = true
autopilot-engine = { path = "../engine" }
autopilot-notify = { path = "../notify" }
autopilot-pipeline = { path = "../pipeline" }
autopilot-profile = { path = "../profile" }
autopilot-store = { path = "../store" }
autopilot-update = { path = "../update" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.16", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "autopilot-ui"
path = "src/main.rs"
