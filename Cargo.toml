[workspace]
members = [
    "crates/agent",
    "crates/agent-fixture",
    "crates/cli",
    "crates/core",
    "crates/engine",
    "crates/process",
    "crates/profile",
    "crates/store",
    "tools/fake-agent",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
autopilot-core = { path = "crates/core" }
cargo_metadata = "0.23"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
syn = { version = "3", features = ["full", "visit"] }
tempfile = "3"
thiserror = "2"
toml = "1.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.xtask]
inherits = "dev"
