name: Release

# Builds the Windows installer and the macOS disk images for a published
# release, signs the update manifest, and attaches everything to the release.
#
# Secrets:
#   UPDATE_SIGNING_KEY  required. ed25519 private key (PEM). Its public half is
#                       PUBLIC_KEY_HEX in crates/update/src/lib.rs.
#   APPLE_SIGNING_IDENTITY, APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#                       optional. Without them the macOS app is signed ad hoc.
#
# Asset names never change, so releases/latest/download/<name> always works.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.1.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install the pinned Rust toolchain
        run: rustup show
      - run: cargo build --release -p autopilot-ui
      - name: Install NSIS if the image lacks it
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsis) { Add-Content $env:GITHUB_PATH $nsis }
      - name: Build the installer
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          makensis /V2 "/DVERSION=$version" "/DEXE=$PWD\target\release\autopilot-ui.exe" "/DICON=$PWD\assets\icon.ico" "/DOUT=$PWD\dist\autopilot-mode-on-setup-x64.exe" packaging\windows\installer.nsi
          if (-not (Test-Path dist\autopilot-mode-on-setup-x64.exe)) { throw "the installer was not built" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/autopilot-mode-on-setup-x64.exe
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install the pinned Rust toolchain
        run: rustup show
      - run: cargo build --release -p autopilot-ui
      - name: Import the signing certificate, if there is one
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "no certificate: the app will be signed ad hoc"; exit 0; fi
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build the disk image
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          mkdir dist
          packaging/macos/build-dmg.sh "${TAG#v}" target/release/autopilot-ui assets/icon-512.png "dist/autopilot-mode-on-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/autopilot-mode-on-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    name: Sign the manifest and publish
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the release notes file
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json body --jq .body > notes.txt
      - name: Write and sign latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "UPDATE_SIGNING_KEY is not set" >&2; exit 1; fi
          packaging/manifest.sh "$TAG" dist notes.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/latest.json
      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
