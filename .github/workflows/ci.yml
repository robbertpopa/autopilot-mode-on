name: Rust CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.22.0,cargo-machete@0.10.1
      - run: cargo xtask ci
